<title>Memorial LABRIGA</title>
<style>
:root{--bg:#f3f1ea;--fg:#16201a;--mut:#6a746f;--card:#fff;--ac:#1c7a4b;--gd:#a2751a;--bd:#e2ddce;--hd:#0f2a1b;--hd2:#1d5a38;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b110e;--fg:#e9eeea;--mut:#8f9d96;--card:#141d18;--ac:#4fc388;--gd:#e0b252;--bd:#24312a;--hd:#0a1f13;--hd2:#17452c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b110e;--fg:#e9eeea;--mut:#8f9d96;--card:#141d18;--ac:#4fc388;--gd:#e0b252;--bd:#24312a;--hd:#0a1f13;--hd2:#17452c;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
header{background:linear-gradient(135deg,var(--hd),var(--hd2));color:#fff;padding:20px 16px 22px;border-radius:0 0 22px 22px}
.hw{max-width:860px;margin:0 auto;display:flex;gap:12px;align-items:center}.lg{width:46px;height:46px;border-radius:14px;background:#ffffff18;display:grid;place-items:center;font-size:24px}
h1{font-size:24px;margin:0;letter-spacing:.3px;line-height:1.1}h1 span{color:#e8bd5c}header p{margin:3px 0 0;opacity:.75;font-size:13px}
main{max-width:860px;margin:0 auto;padding:4px 14px 96px}
.s{color:var(--mut);font-size:13px}.foot{margin:18px 2px;line-height:1.5}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin:12px 0;box-shadow:0 1px 2px #0000000d}
.ct{font-size:12px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,button{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:11px;padding:9px 12px;max-width:100%;outline:0}
input:focus,select:focus{border-color:var(--ac)}input[type=number]{width:76px}button{cursor:pointer;font-weight:600}
button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
.chip{padding:6px 12px;border-radius:99px;font-size:13px;font-weight:600}.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.fl{margin-top:14px}.fh{display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer}#fb{margin-top:12px;padding-top:12px;border-top:1px solid var(--bd)}
.pill{font-size:12px;font-weight:700;color:var(--ac);border:1px solid var(--ac);border-radius:99px;padding:4px 11px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;gap:2px;background:var(--card);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.nv{flex:1;max-width:120px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;color:var(--mut);padding:6px 2px;border-radius:12px}.nv span{font-size:19px}.nv.on{color:var(--gd);background:var(--bg)}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}.kp div{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 4px;text-align:center}.kp b{display:block;font-size:20px;color:var(--gd)}.kp span{font-size:11px;color:var(--mut)}
.lr{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd);cursor:pointer}.lr:last-child{border:0}
.rn{min-width:26px;height:26px;border-radius:8px;background:var(--bg);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--mut)}.rn.top{background:var(--gd);color:#fff}
.nm{flex:1;min-width:0}.nm small{display:block;color:var(--mut);font-size:12px}.vl{font-weight:800;font-size:17px;color:var(--gd)}
.cc{display:flex;gap:12px;align-items:center}.cn{min-width:40px;height:40px;border-radius:12px;background:var(--hd);color:#e8bd5c;display:grid;place-items:center;font-weight:800}
.cb{flex:1;min-width:0}.ti{font-weight:700;line-height:1.25}.pd{margin-top:3px}.gd{color:var(--gd);font-weight:800}.tl{font-size:13px;color:var(--mut);margin:2px 0}
.tag{font-size:11px;background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:1px 7px;color:var(--mut)}
.pc{display:inline-flex;gap:6px;align-items:center;border:2px solid var(--c);border-radius:99px;padding:4px 7px 4px 13px;font-weight:700;font-size:13px}.pc a{cursor:pointer;opacity:.6;padding:0 5px}
.cg{margin-top:6px}.ch,.rv{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:8px;text-align:center}
.ch>div{border-top:4px solid var(--c);padding-top:7px;font-size:14px;min-width:0;overflow-wrap:anywhere}.ch small{display:block;color:var(--mut);font-size:11px}
.rl{text-align:center;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.7px;margin-top:14px}
.rv>div{font-weight:600;position:relative;padding-bottom:7px;min-width:0;overflow-wrap:anywhere}.rv>div.bs{color:var(--gd);font-weight:800}
.rv i{position:absolute;left:12%;bottom:0;height:3px;border-radius:3px;max-width:76%;opacity:.85}
.pf{display:flex;gap:14px;align-items:center}.nb{min-width:68px;height:68px;border-radius:18px;color:#fff;font-size:28px;font-weight:800;display:grid;place-items:center}.gr{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;text-align:center}.gr div{background:var(--bg);border-radius:12px;padding:10px 4px}.gr b{display:block;font-size:19px}.gr span,.gr small{display:block;font-size:11px;color:var(--mut)}.bar{display:block;height:3px;border-radius:3px;margin-top:4px}
input,select{font-size:16px}.sg{width:100%;display:flex;flex-wrap:wrap;gap:6px}.sg:empty{display:none}.hl{max-height:380px;overflow:auto}.cmp1{text-align:center;margin:4px 0 8px;font-size:16px}
#md{position:fixed;inset:0;background:#000c;z-index:20;display:flex;align-items:center;justify-content:center;padding:14px}
.mb{background:var(--card);border-radius:16px;padding:12px;max-width:520px;max-height:100%;overflow:auto}.mb img{width:100%;border-radius:10px;display:block;margin-bottom:10px}

/* tema roxo */
:root{--pr:#6d3fd6;--ac:#6d3fd6;--bg:#f6f3fc;--fg:#1a1428;--mut:#6f6a80;--card:#fff;--bd:#e5dff3;--hd:#2c1370;--hd2:#6d3fd6;--sh:0 1px 2px #1a14280d,0 8px 24px -12px #4c2a9e33}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--pr:#a78bfa;--ac:#8b5cf6;--bg:#0f0b1a;--fg:#ece8f8;--mut:#9a92b5;--card:#1a1430;--bd:#2c2450;--hd:#1a0f3d;--hd2:#4c2a9e;--sh:0 1px 2px #0006,0 8px 24px -12px #000}}
:root[data-theme="dark"]{--pr:#a78bfa;--ac:#8b5cf6;--bg:#0f0b1a;--fg:#ece8f8;--mut:#9a92b5;--card:#1a1430;--bd:#2c2450;--hd:#1a0f3d;--hd2:#4c2a9e;--sh:0 1px 2px #0006,0 8px 24px -12px #000}
html{-webkit-tap-highlight-color:transparent;scroll-behavior:smooth}
header{background:radial-gradient(120% 140% at 90% -20%,#a78bfa66,transparent 55%),linear-gradient(135deg,var(--hd),var(--hd2));padding:22px 16px 28px}
.lg{background:#ffffff22;box-shadow:inset 0 0 0 1px #ffffff2a}
.card{box-shadow:var(--sh);border-radius:18px;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
button,.lr,.nv{position:relative;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;transition:transform .15s,background .2s,color .2s,border-color .2s,box-shadow .2s}
button{min-height:42px;border-radius:12px}button:active,.lr:active{transform:scale(.97)}
button.pri{background:linear-gradient(135deg,var(--ac),#9b6bff);border-color:transparent;color:#fff}
.vl,.kp b,.pill{color:var(--pr)}.pill{border-color:var(--pr)}
.nv.on{color:var(--pr);background:#8b5cf622}.nv.on span{animation:pop .4s}
.cn{background:linear-gradient(135deg,var(--hd),var(--hd2));color:#fff}
input:focus,select:focus{border-color:var(--pr);box-shadow:0 0 0 3px #8b5cf633}:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
nav{backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:color-mix(in srgb,var(--card) 88%,transparent)}
.rp{position:absolute;border-radius:50%;background:currentColor;opacity:.2;transform:scale(0);animation:rp .6s ease-out;pointer-events:none}
@keyframes rp{to{transform:scale(1);opacity:0}}@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes inUp{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}@keyframes grow{from{width:0}}@keyframes fade{from{opacity:0}}@keyframes pu{from{transform:translateY(24px) scale(.94);opacity:0}}
.pg>*{animation:inUp .5s cubic-bezier(.2,.8,.2,1) backwards}.pg>*:nth-child(2){animation-delay:.05s}.pg>*:nth-child(3){animation-delay:.1s}.pg>*:nth-child(4){animation-delay:.15s}.pg>*:nth-child(5){animation-delay:.2s}.pg>*:nth-child(6){animation-delay:.25s}.pg>*:nth-child(n+7){animation-delay:.3s}
.bar,.rv i{animation:grow .9s cubic-bezier(.2,.8,.2,1) backwards}#md{animation:fade .2s}.mb{animation:pu .3s cubic-bezier(.2,.9,.3,1.2)}
@media(hover:hover){.card:hover{transform:translateY(-2px);box-shadow:0 14px 32px -14px #4c2a9e55}button:hover{border-color:var(--pr)}button.pri:hover{box-shadow:0 6px 16px -6px var(--ac)}.lr:hover{background:#8b5cf610}}
@media(min-width:900px){body{font-size:16px}
nav{top:0;bottom:0;right:auto;left:0;width:230px;flex-direction:column;justify-content:flex-start;gap:6px;padding:84px 14px 14px;border-top:0;border-right:1px solid var(--bd)}
nav::before{content:"LABRIGA";position:absolute;top:28px;left:26px;font-weight:800;letter-spacing:3px;color:var(--pr);font-size:15px}
.nv{flex:none;max-width:none;flex-direction:row;gap:12px;font-size:15px;padding:12px 14px;justify-content:flex-start;border-radius:14px}.nv span{font-size:20px}

#bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
#bg::before{content:"";position:absolute;right:-14vmin;bottom:-8vmin;width:80vmin;height:96vmin;background:var(--pr);opacity:.075;-webkit-mask:var(--ic) center/contain no-repeat;mask:var(--ic) center/contain no-repeat;animation:fl 22s ease-in-out infinite alternate}
#bg::after{content:"";position:absolute;inset:-20%;background:radial-gradient(40% 40% at 20% 30%,#8b5cf633,transparent 70%),radial-gradient(35% 35% at 80% 70%,#c084fc26,transparent 70%);animation:orb 26s ease-in-out infinite alternate}
@keyframes fl{from{transform:translate(0,0) rotate(-3deg) scale(1)}to{transform:translate(-3vmin,-4vmin) rotate(3deg) scale(1.06)}}@keyframes orb{from{transform:translate(0,0)}to{transform:translate(6%,-4%) scale(1.1)}}
#sp{position:fixed;inset:0;z-index:50;background:radial-gradient(circle at 50% 40%,#7a1fb8,#550981 55%,#2e0650);display:grid;place-items:center;transition:opacity .55s,visibility .55s}
#sp img{width:min(64vw,330px);animation:sin 1.1s cubic-bezier(.2,.8,.2,1) both,glow 1.8s ease-in-out infinite alternate}#sp.out{opacity:0;visibility:hidden}
@keyframes sin{from{opacity:0;transform:scale(.7) translateY(24px)}}@keyframes glow{to{filter:drop-shadow(0 0 26px #d8b4fecc)}}
@media(min-width:900px){.lg{width:64px;height:64px}}
@media(prefers-reduced-motion:reduce){#sp{display:none}}

details{border-top:1px solid var(--bd)}details:first-of-type{border-top:0}summary{cursor:pointer;padding:12px 2px;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px}summary::-webkit-details-marker{display:none}summary::after{content:'▾';color:var(--pr);transition:transform .2s}details[open]>summary::after{transform:rotate(180deg)}summary .s{margin-left:auto;font-weight:400}
.st{font-size:13px}.st td small{display:block;color:var(--mut);font-size:11px}.st td:first-child{white-space:nowrap;min-width:38px}.st tr.rb td{background:#ef444418}.st tr.rb td:first-child{color:#ef4444;font-weight:700}.st tr.chp td{background:#8b5cf61a}.st th,.st td{padding:6px 5px}
.rd{font-size:11px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--mut);margin:12px 0 2px}
.mt{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--bd);font-size:13px}.mt .r{text-align:right}.mt small{display:block;color:var(--mut);font-size:11px}.mt .s2{font-weight:800;font-size:15px;color:var(--pr);text-align:center;white-space:nowrap}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

function vst(n){const g=ST[n];if(!g)return'';const ch=C[n-1].c;return`<div class="card"><div class="ct">Classificação</div>${g.map((x,i)=>`<details ${i==0?'open':''}><summary>${x[0]||'Geral'} <span class="s">${x[1].length} times</span></summary><div class="sc"><table class="st"><tr><th>#</th><th>Clube</th><th>Pts</th><th>J</th><th>V</th><th>E</th><th>D</th><th>SG</th></tr>${x[1].map(r=>`<tr class="${r[2]==ch?'chp':r[11]?'rb':''}"><td>${r[0]}${r[11]?' ↓':''}</td><td>${r[1]||'—'}<small>${r[2]||''}</small></td><td><b>${r[3]??''}</b></td><td>${r[4]??''}</td><td>${r[5]??''}</td><td>${r[6]??''}</td><td>${r[7]??''}</td><td>${r[10]??''}</td></tr>`).join('')}</table></div>${x[1].some(r=>r[11])?`<div class="s" style="margin:6px 0 4px;color:#ef4444">↓ Rebaixados: ${x[1].filter(r=>r[11]).map(r=>r[2]+' ('+r[1]+')').join(', ')}</div>`:''}</details>`).join('')}</div>`}
function vrd(n){const rows=RM.filter(m=>m[0]==n);if(!rows.length)return'';const fm=new Map();rows.forEach(m=>{const f=FS[m[1]]||'Jogos';if(!fm.has(f))fm.set(f,new Map());const r=RS[m[2]]||'';if(!fm.get(f).has(r))fm.get(f).set(r,[]);fm.get(f).get(r).push(m)});
return`<div class="card"><div class="ct">Rodadas e jogos <span class="s">(${rows.length} jogos)</span></div>${[...fm].map(([f,R])=>`<details ${fm.size==1?'open':''}><summary>${f} <span class="s">${[...R.values()].reduce((a,b)=>a+b.length,0)} jogos</span></summary>${[...R].map(([r,L])=>`${r?`<div class="rd">${r}</div>`:''}${L.map(m=>`<div class="mt"><span>${CLn(m[7])}<small>${Pn(m[3])}</small></span><span class="s2">${m[5]==null||m[6]==null?'×':m[5]+' × '+m[6]}${m[9]!=null?`<small>pên. ${m[9]}×${m[10]}</small>`:''}</span><span class="r">${CLn(m[8])}<small>${Pn(m[4])}</small></span></div>`).join('')}`).join('')}</details>`).join('')}</div>`}

function rbx(n,set){const L=[];let p=0;for(const k in ST){if(!set.has(+k))continue;const g=ST[k];if(!g.some(x=>x[1].some(r=>r[11])))continue;g.forEach(x=>x[1].forEach(r=>{if(r[2]==n){p++;if(r[11])L.push(+k)}}))}return{p,L}}
const rbl=(n,set)=>{const o=rbx(n,set);return o.p?(o.L.length?`<div class="s" style="color:#ef4444;font-weight:700">↓ Rebaixado ${o.L.length}× · ${o.L.map(k=>'#'+k).join(', ')}</div>`:`<div class="s">✅ Nunca foi rebaixado (disputou ${o.p} liga${o.p>1?'s':''} com rebaixamento)</div>`):''};
draw();
